name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make clean && make all test release-demo
      - run: make sanitize
      - run: python3 tests/fuzz/test_parser_regressions.py

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make clean && make all test release-demo

  # Windows x64 (MSVC) runtime backend: builds with cl (no make on Windows), seals a copy of the
  # demo EXE, runs it, tampers .text and checks detection. Skipped on purpose: the POSIX-only
  # parts (tests/test_seal_workflow.py needs nm and POSIX paths, the RESHIELD_DISABLE variants
  # of the tests, the fork-based cases inside test_manifest.c which are #ifndef _WIN32).
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Visual Studio
        shell: cmd
        run: |
          mkdir build\lib
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSDIR=%%i"
          echo VSDIR=%VSDIR%>>"%GITHUB_ENV%"

      - name: Build library, tests and examples with cl
        shell: cmd
        run: |
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          set CFLAGS=/nologo /std:c11 /O2 /W3 /WX /I include
          set TFLAGS=%CFLAGS% /D_CRT_SECURE_NO_WARNINGS /D_CRT_NONSTDC_NO_WARNINGS
          cl %CFLAGS% /c /Fo:build\lib\ src\sha256.c src\integrity_common.c src\integrity_windows.c src\file_windows.c src\manifest.c src\attestation_windows.c src\reshield.c || exit /b 1
          lib /nologo /OUT:build\reshield.lib build\lib\sha256.obj build\lib\integrity_common.obj build\lib\integrity_windows.obj build\lib\file_windows.obj build\lib\manifest.obj build\lib\attestation_windows.obj build\lib\reshield.obj || exit /b 1
          cl %CFLAGS% /Fo:build\ examples\integrity_demo.c build\reshield.lib /Fe:build\integrity_demo.exe /link /INCREMENTAL:NO || set FAIL=1
          cl %CFLAGS% /Fo:build\ examples\sample_game.c build\reshield.lib /Fe:build\sample_game.exe /link /INCREMENTAL:NO || set FAIL=1
          cl %TFLAGS% /Fo:build\ tests\test_integrity.c build\reshield.lib /Fe:build\test_integrity.exe /link /INCREMENTAL:NO || set FAIL=1
          cl %TFLAGS% /Fo:build\ tests\test_manifest.c build\reshield.lib /Fe:build\test_manifest.exe /link /INCREMENTAL:NO || set FAIL=1
          cl %TFLAGS% /Fo:build\ tests\test_runtime.c build\reshield.lib /Fe:build\test_runtime.exe /link /INCREMENTAL:NO || set FAIL=1
          cl %TFLAGS% /Fo:build\ tests\test_wx.c build\reshield.lib /Fe:build\test_wx.exe /link /INCREMENTAL:NO || set FAIL=1
          if defined FAIL exit /b 1

      - name: Unit tests
        shell: pwsh
        run: |
          $bad = 0
          foreach ($t in 'test_integrity', 'test_manifest', 'test_runtime', 'test_wx') {
            "=== $t ==="
            & ".\build\$t.exe"
            if ($LASTEXITCODE -ne 0) { "FAILED: $t exit=$LASTEXITCODE"; $bad = 1 }
          }
          exit $bad

      - name: Seal, run, tamper, verify_release (integrity_demo)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Expect([string]$exe, [int]$want, [string]$what, [string[]]$extra = @()) {
            $out = & $exe @extra 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne $want) { throw "$what : expected exit $want, got $LASTEXITCODE" }
            return $out
          }
          # reshield_status_t: OK=0 UNSEALED=1 CODE_TAMPERED=2 CODESIGN_INVALID=4
          Expect .\build\integrity_demo.exe 1 "unsealed EXE is reported UNSEALED" | Out-Null
          Expect .\build\integrity_demo.exe 0 "unsealed EXE passes with --allow-unsealed (W^X check ran and passed)" @("--allow-unsealed") | Out-Null

          Copy-Item build\integrity_demo.exe build\demo_sealed.exe
          python tools\seal_binary.py build\demo_sealed.exe --build-id 7
          if ($LASTEXITCODE -ne 0) { throw "seal_binary failed" }
          $o = Expect .\build\demo_sealed.exe 0 "sealed EXE verifies OK"
          if ($o -notmatch 'status=OK') { throw "sealed EXE did not print status=OK" }
          python tools\seal_binary.py build\demo_sealed.exe --verify-only
          if ($LASTEXITCODE -ne 0) { throw "verify-only failed" }
          python tools\verify_release.py build\demo_sealed.exe
          if ($LASTEXITCODE -ne 0) { throw "verify_release failed" }

          Expect .\build\demo_sealed.exe 4 "unsigned sealed EXE: WinVerifyTrust codesign check fails" @("--check-codesign") | Out-Null

          python tests\tamper_pe_text.py build\demo_sealed.exe build\demo_tampered.exe
          if ($LASTEXITCODE -ne 0) { throw "tamper helper failed" }
          $o = Expect .\build\demo_tampered.exe 2 "tampered .text is detected as CODE_TAMPERED"
          if ($o -notmatch 'CODE_TAMPERED') { throw "tampered EXE did not report CODE_TAMPERED" }

      - name: Sealed sample_game with manifest (release-demo equivalent)
        shell: pwsh
        run: |
          python tools\gen_manifest.py examples\assets -o build\sample_assets.manifest
          if ($LASTEXITCODE -ne 0) { throw "gen_manifest failed" }
          Copy-Item build\sample_game.exe build\sample_game_sealed.exe
          python tools\seal_binary.py build\sample_game_sealed.exe --manifest build\sample_assets.manifest --build-id 1
          if ($LASTEXITCODE -ne 0) { throw "seal failed" }
          python tools\verify_release.py build\sample_game_sealed.exe --manifest build\sample_assets.manifest --assets examples\assets
          if ($LASTEXITCODE -ne 0) { throw "verify_release failed" }
          .\build\sample_game_sealed.exe build\sample_assets.manifest examples\assets STAGE-1-CLEAR-2026
          if ($LASTEXITCODE -ne 0) { throw "sealed sample_game exit=$LASTEXITCODE" }

  # Measured 2026-11-24: an MSVC-built EXE has 0 base relocations inside .text and seals fine.
  # Kept as a probe: it builds with cl, prints pe_probe/dumpbin output, and uploads them.
  # Not a gate (continue-on-error): it never asserts, so a failure only means the toolchain moved.
  windows-msvc-probe:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Locate Visual Studio
        shell: cmd
        run: |
          mkdir build
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSDIR=%%i"
          echo VSDIR=%VSDIR%
          echo VSDIR=%VSDIR%>>"%GITHUB_ENV%"

      - name: Build integrity_demo with cl
        shell: cmd
        run: |
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c11 /O2 /W3 /I include /Fo:build\ src\sha256.c src\integrity_common.c src\integrity_windows.c src\attestation_windows.c src\manifest.c src\file_windows.c src\reshield.c examples\integrity_demo.c /Fe:build\integrity_demo.exe /link /INCREMENTAL:NO > build\build.log 2>&1
          set RC=%ERRORLEVEL%
          type build\build.log
          exit /b %RC%

      - name: Measure PE properties
        if: always()
        shell: cmd
        run: |
          if exist build\integrity_demo.exe (python tools\pe_probe.py build\integrity_demo.exe > build\pe_probe.txt 2>&1) else (echo build\integrity_demo.exe was not produced > build\pe_probe.txt)
          type build\pe_probe.txt
          exit /b 0

      - name: dumpbin headers and relocations
        if: always()
        shell: cmd
        run: |
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          if exist build\integrity_demo.exe (dumpbin /headers /relocations build\integrity_demo.exe > build\dumpbin.txt 2>&1) else (echo build\integrity_demo.exe was not produced > build\dumpbin.txt)
          exit /b 0

      - name: Summarize
        if: always()
        shell: pwsh
        run: |
          foreach ($f in 'build.log', 'pe_probe.txt', 'dumpbin.txt') {
            $p = "build/$f"
            "### $f" >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
            if (Test-Path $p) { Get-Content -TotalCount 80 $p >> $env:GITHUB_STEP_SUMMARY } else { '(missing)' >> $env:GITHUB_STEP_SUMMARY }
            '```' >> $env:GITHUB_STEP_SUMMARY
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-msvc-probe
          path: |
            build/build.log
            build/pe_probe.txt
            build/dumpbin.txt
          if-no-files-found: warn
