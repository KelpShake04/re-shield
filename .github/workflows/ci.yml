name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make clean && make all test release-demo
      - run: make sanitize
      - run: python3 tests/fuzz/test_parser_regressions.py
      # `ld.so ./prog` makes /proc/self/exe the loader: must be an error exit, never a crash (>=128).
      - run: |
          cp build/integrity_demo /tmp/pie
          python3 tools/seal_binary.py /tmp/pie --build-id 5
          /tmp/pie
          rc=0; /lib64/ld-linux-x86-64.so.2 /tmp/pie || rc=$?
          echo "ld.so rc=$rc"
          test "$rc" -ne 0 && test "$rc" -lt 128

  # musl names the main program in dl_iterate_phdr (glibc leaves it empty); build and test there too.
  linux-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache gcc musl-dev make python3 binutils &&
            make clean && make all test release-demo &&
            for mode in "-pie -fPIE" "-no-pie" "-static" "-static-pie"; do
              gcc -std=c11 -O2 -Iinclude examples/integrity_demo.c src/sha256.c src/integrity_common.c src/integrity_linux.c src/file_posix.c src/manifest.c src/attestation_linux.c src/reshield.c $mode -o /tmp/p &&
              python3 tools/seal_binary.py /tmp/p --build-id 3 >/dev/null &&
              /tmp/p | grep -q "status=OK" || { echo "FAILED: $mode"; exit 1; }
              echo "OK: $mode"
            done'

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make clean && make all test release-demo

  # Windows x64 (MSVC) runtime backend: builds with cl (no make on Windows), seals a copy of the
  # demo EXE, runs it, tampers .text and checks detection. Skipped on purpose: the POSIX-only
  # parts (tests/test_seal_workflow.py needs nm and POSIX paths, the RESHIELD_DISABLE variants
  # of the tests, the fork-based cases inside test_manifest.c which are #ifndef _WIN32).
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Visual Studio
        shell: cmd
        run: |
          mkdir build\lib
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSDIR=%%i"
          echo VSDIR=%VSDIR%>>"%GITHUB_ENV%"

      - name: Build library, tests and examples with cl
        shell: cmd
        run: |
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          set CFLAGS=/nologo /std:c11 /O2 /W3 /WX /DRESHIELD_ALLOW_UNSEALED /I include
          set TFLAGS=%CFLAGS% /D_CRT_SECURE_NO_WARNINGS /D_CRT_NONSTDC_NO_WARNINGS
          cl %CFLAGS% /c /Fo:build\lib\ src\sha256.c src\integrity_common.c src\integrity_windows.c src\file_windows.c src\manifest.c src\attestation_windows.c src\reshield.c src\verify_app.c src\save_seal.c || exit /b 1
          lib /nologo /OUT:build\reshield.lib build\lib\sha256.obj build\lib\integrity_common.obj build\lib\integrity_windows.obj build\lib\file_windows.obj build\lib\manifest.obj build\lib\attestation_windows.obj build\lib\reshield.obj build\lib\verify_app.obj build\lib\save_seal.obj || exit /b 1
          cl %CFLAGS% /Fo:build\ examples\integrity_demo.c build\reshield.lib /Fe:build\integrity_demo.exe /link /INCREMENTAL:NO || set FAIL=1
          cl %CFLAGS% /Fo:build\ examples\sample_game.c build\reshield.lib /Fe:build\sample_game.exe /link /INCREMENTAL:NO || set FAIL=1
          cl %TFLAGS% /Fo:build\ tests\test_integrity.c build\reshield.lib /Fe:build\test_integrity.exe /link /INCREMENTAL:NO || set FAIL=1
          cl %TFLAGS% /Fo:build\ tests\test_manifest.c build\reshield.lib /Fe:build\test_manifest.exe /link /INCREMENTAL:NO || set FAIL=1
          cl %TFLAGS% /Fo:build\ tests\test_runtime.c build\reshield.lib /Fe:build\test_runtime.exe /link /INCREMENTAL:NO || set FAIL=1
          cl %TFLAGS% /Fo:build\ tests\test_wx.c build\reshield.lib /Fe:build\test_wx.exe /link /INCREMENTAL:NO || set FAIL=1
          cl %TFLAGS% /Fo:build\ tests\test_verify_app.c build\reshield.lib /Fe:build\test_verify_app.exe /link /INCREMENTAL:NO || set FAIL=1
          cl %TFLAGS% /Fo:build\ tests\test_save_seal.c build\reshield.lib /Fe:build\test_save_seal.exe /link /INCREMENTAL:NO || set FAIL=1
          cl %TFLAGS% /Fo:build\ tests\test_codesign_toctou_windows.c build\reshield.lib /Fe:build\test_codesign_toctou_windows.exe /link /INCREMENTAL:NO || set FAIL=1
          if defined FAIL exit /b 1

      - name: Unit tests
        shell: pwsh
        run: |
          $bad = 0
          foreach ($t in 'test_integrity', 'test_manifest', 'test_runtime', 'test_wx', 'test_save_seal') {
            "=== $t ==="
            & ".\build\$t.exe"
            if ($LASTEXITCODE -ne 0) { "FAILED: $t exit=$LASTEXITCODE"; $bad = 1 }
          }
          exit $bad

      - name: Seal, run, tamper, verify_release (integrity_demo)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Expect([string]$exe, [int]$want, [string]$what, [string[]]$extra = @()) {
            $out = & $exe @extra 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne $want) { throw "$what : expected exit $want, got $LASTEXITCODE" }
            return $out
          }
          # reshield_status_t: OK=0 UNSEALED=1 CODE_TAMPERED=2 CODESIGN_INVALID=4
          Expect .\build\integrity_demo.exe 1 "unsealed EXE is reported UNSEALED" | Out-Null
          Expect .\build\integrity_demo.exe 0 "unsealed EXE passes with --allow-unsealed (W^X check ran and passed)" @("--allow-unsealed") | Out-Null

          Copy-Item build\integrity_demo.exe build\demo_sealed.exe
          python tools\seal_binary.py build\demo_sealed.exe --build-id 7
          if ($LASTEXITCODE -ne 0) { throw "seal_binary failed" }
          $o = Expect .\build\demo_sealed.exe 0 "sealed EXE verifies OK"
          if ($o -notmatch 'status=OK') { throw "sealed EXE did not print status=OK" }
          python tools\seal_binary.py build\demo_sealed.exe --verify-only
          if ($LASTEXITCODE -ne 0) { throw "verify-only failed" }
          python tools\verify_release.py build\demo_sealed.exe
          if ($LASTEXITCODE -ne 0) { throw "verify_release failed" }

          Expect .\build\demo_sealed.exe 4 "unsigned sealed EXE: WinVerifyTrust codesign check fails" @("--check-codesign") | Out-Null

          python tests\tamper_pe_text.py build\demo_sealed.exe build\demo_tampered.exe
          if ($LASTEXITCODE -ne 0) { throw "tamper helper failed" }
          $o = Expect .\build\demo_tampered.exe 2 "tampered .text is detected as CODE_TAMPERED"
          if ($o -notmatch 'CODE_TAMPERED') { throw "tampered EXE did not report CODE_TAMPERED" }
          exit 0  # the last native call exited 2 on purpose; every real failure above throws

      # Throwaway self-signed code-signing cert, trusted only inside this runner (admin): lets
      # WinVerifyTrust accept the signed copy so the positive paths are exercised for real.
      - name: Authenticode-signed sealed EXE (positive codesign + leaf pin)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Expect([string]$exe, [int]$want, [string]$what, [string[]]$extra = @()) {
            $out = & $exe @extra 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne $want) { throw "$what : expected exit $want, got $LASTEXITCODE" }
            return $out
          }
          # reshield_status_t: OK=0 CODE_TAMPERED=2 CODESIGN_INVALID=4
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=reshield-ci" -CertStoreLocation Cert:\CurrentUser\My -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -NotAfter (Get-Date).AddDays(2)
          Export-Certificate -Cert $cert -FilePath build\reshield-ci.cer | Out-Null
          foreach ($store in 'Root', 'TrustedPublisher') {
            Import-Certificate -FilePath build\reshield-ci.cer -CertStoreLocation "Cert:\LocalMachine\$store" | Out-Null
          }
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $leaf = ([System.BitConverter]::ToString($sha.ComputeHash([System.IO.File]::ReadAllBytes("$PWD\build\reshield-ci.cer")))).Replace('-', '').ToLowerInvariant()
          Write-Host "leaf cert SHA-256: $leaf"

          Copy-Item build\demo_sealed.exe build\demo_signed.exe
          $sig = Set-AuthenticodeSignature -FilePath build\demo_signed.exe -Certificate $cert -HashAlgorithm SHA256
          Write-Host "Set-AuthenticodeSignature: $($sig.Status) $($sig.StatusMessage)"
          $chk = Get-AuthenticodeSignature -FilePath build\demo_signed.exe
          Write-Host "Get-AuthenticodeSignature: $($chk.Status) $($chk.StatusMessage)"
          if ($chk.Status -ne 'Valid') { throw "runner does not trust the throwaway cert: $($chk.Status)" }

          # seal first, sign after: the seal and the release checks still hold on the signed file
          python tools\seal_binary.py build\demo_signed.exe --verify-only
          if ($LASTEXITCODE -ne 0) { throw "verify-only on signed EXE failed" }
          python tools\verify_release.py build\demo_signed.exe
          if ($LASTEXITCODE -ne 0) { throw "verify_release on signed EXE failed" }

          $o = Expect .\build\demo_signed.exe 0 "signed sealed EXE: WinVerifyTrust passes" @("--check-codesign")
          if ($o -notmatch 'status=OK') { throw "signed EXE did not print status=OK" }
          Expect .\build\demo_signed.exe 0 "correct leaf pin" @("--check-codesign", "--codesign-requirement=leaf-sha256:$leaf") | Out-Null
          Expect .\build\demo_signed.exe 0 "correct leaf pin, upper-case hex" @("--check-codesign", "--codesign-requirement=leaf-sha256:$($leaf.ToUpperInvariant())") | Out-Null
          $wrong = '0' * 64
          $o = Expect .\build\demo_signed.exe 4 "wrong leaf pin" @("--check-codesign", "--codesign-requirement=leaf-sha256:$wrong")
          if ($o -notmatch 'CODESIGN_INVALID') { throw "wrong pin did not report CODESIGN_INVALID" }
          $flip = $leaf.Substring(0, 63) + $(if ($leaf[63] -eq '0') { '1' } else { '0' })
          Expect .\build\demo_signed.exe 4 "leaf pin differing in one nibble" @("--check-codesign", "--codesign-requirement=leaf-sha256:$flip") | Out-Null
          foreach ($bad in "anchor apple", "leaf-sha256:", "leaf-sha256:abcd", "leaf-sha256:$($leaf.Substring(0, 63))g", "leaf-sha256:${leaf}00", "LEAF-SHA256:$leaf", "sha1:$leaf") {
            Expect .\build\demo_signed.exe 4 "malformed requirement '$bad'" @("--check-codesign", "--codesign-requirement=$bad") | Out-Null
          }
          # a requirement alone does nothing unless RESHIELD_CHECK_CODESIGN is enabled
          Expect .\build\demo_signed.exe 0 "pin without --check-codesign is not evaluated" @("--codesign-requirement=leaf-sha256:$wrong") | Out-Null

          # tamper one .text byte of the signed file: the hash seal must report CODE_TAMPERED
          python tests\tamper_pe_text.py build\demo_signed.exe build\demo_signed_tampered.exe
          if ($LASTEXITCODE -ne 0) { throw "tamper helper failed on signed EXE" }
          $o = Expect .\build\demo_signed_tampered.exe 2 "tampered signed EXE: CODE_TAMPERED"
          if ($o -notmatch 'CODE_TAMPERED') { throw "tampered signed EXE did not report CODE_TAMPERED" }
          # with the codesign check on, the broken Authenticode hash is flagged too (bit 0x4 + 0x1)
          $o = Expect .\build\demo_signed_tampered.exe 2 "tampered signed EXE with codesign check" @("--check-codesign")
          if ($o -notmatch 'failed_checks=0x5') { throw "expected failed_checks=0x5 (code section + codesign)" }
          exit 0  # the last native call exited 2 on purpose; every real failure above throws

      # The unsigned test EXE renames its own running image and drops the validly signed demo at the
      # old path; the check must still fail because it verifies the mapped image, not the path.
      - name: Rename-and-replace is detected (mapped-image verification)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\toctou | Out-Null
          Copy-Item build\test_codesign_toctou_windows.exe build\toctou\victim.exe
          & .\build\toctou\victim.exe "$PWD\build\demo_signed.exe"
          if ($LASTEXITCODE -ne 0) { throw "toctou test exit=$LASTEXITCODE" }

      - name: Sealed sample_game with manifest (release-demo equivalent)
        shell: pwsh
        run: |
          python tools\gen_manifest.py examples\assets -o build\sample_assets.manifest
          if ($LASTEXITCODE -ne 0) { throw "gen_manifest failed" }
          Copy-Item build\sample_game.exe build\sample_game_sealed.exe
          python tools\seal_binary.py build\sample_game_sealed.exe --manifest build\sample_assets.manifest --build-id 1
          if ($LASTEXITCODE -ne 0) { throw "seal failed" }
          python tools\verify_release.py build\sample_game_sealed.exe --manifest build\sample_assets.manifest --assets examples\assets
          if ($LASTEXITCODE -ne 0) { throw "verify_release failed" }
          .\build\sample_game_sealed.exe build\sample_assets.manifest examples\assets STAGE-1-CLEAR-2026
          if ($LASTEXITCODE -ne 0) { throw "sealed sample_game exit=$LASTEXITCODE" }

      # reshield_verify_app: manifest and assets are found next to the EXE even when the CWD is elsewhere.
      # Exit code = 10 + status: OK=0 ASSET_TAMPERED=6 MANIFEST_IO=8.
      - name: verify_app resolves paths next to the EXE (GetModuleFileNameW)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force build\va, build\va_cwd | Out-Null
          Copy-Item -Recurse examples\assets build\va\assets
          python tools\gen_manifest.py build\va\assets -o build\va\vapp.manifest
          if ($LASTEXITCODE -ne 0) { throw "gen_manifest failed" }
          Copy-Item build\test_verify_app.exe build\va\vapp.exe
          python tools\seal_binary.py build\va\vapp.exe --manifest build\va\vapp.manifest --build-id 9
          if ($LASTEXITCODE -ne 0) { throw "seal failed" }
          $exe = Resolve-Path build\va\vapp.exe
          Push-Location build\va_cwd
          function Run([int]$want, [string]$what) {
            $out = & $exe vapp.manifest assets 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne $want) { throw "$what : expected exit $want, got $LASTEXITCODE" }
          }
          Run 10 "sealed EXE run from another CWD"
          Add-Content -Path ..\va\assets\stage1.cfg -Value "x" -NoNewline
          Run 16 "tampered asset"
          Remove-Item ..\va\vapp.manifest
          Run 18 "missing manifest"
          Pop-Location
          exit 0  # the last native call exited non-zero on purpose; every real failure above throws

  # Measured 2026-11-24: an MSVC-built EXE has 0 base relocations inside .text and seals fine.
  # Kept as a probe: it builds with cl, prints pe_probe/dumpbin output, and uploads them.
  # Not a gate (continue-on-error): it never asserts, so a failure only means the toolchain moved.
  windows-msvc-probe:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Locate Visual Studio
        shell: cmd
        run: |
          mkdir build
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSDIR=%%i"
          echo VSDIR=%VSDIR%
          echo VSDIR=%VSDIR%>>"%GITHUB_ENV%"

      - name: Build integrity_demo with cl
        shell: cmd
        run: |
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c11 /O2 /W3 /I include /Fo:build\ src\sha256.c src\integrity_common.c src\integrity_windows.c src\attestation_windows.c src\manifest.c src\file_windows.c src\reshield.c examples\integrity_demo.c /Fe:build\integrity_demo.exe /link /INCREMENTAL:NO > build\build.log 2>&1
          set RC=%ERRORLEVEL%
          type build\build.log
          exit /b %RC%

      - name: Measure PE properties
        if: always()
        shell: cmd
        run: |
          if exist build\integrity_demo.exe (python tools\pe_probe.py build\integrity_demo.exe > build\pe_probe.txt 2>&1) else (echo build\integrity_demo.exe was not produced > build\pe_probe.txt)
          type build\pe_probe.txt
          exit /b 0

      - name: dumpbin headers and relocations
        if: always()
        shell: cmd
        run: |
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          if exist build\integrity_demo.exe (dumpbin /headers /relocations build\integrity_demo.exe > build\dumpbin.txt 2>&1) else (echo build\integrity_demo.exe was not produced > build\dumpbin.txt)
          exit /b 0

      - name: Summarize
        if: always()
        shell: pwsh
        run: |
          foreach ($f in 'build.log', 'pe_probe.txt', 'dumpbin.txt') {
            $p = "build/$f"
            "### $f" >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
            if (Test-Path $p) { Get-Content -TotalCount 80 $p >> $env:GITHUB_STEP_SUMMARY } else { '(missing)' >> $env:GITHUB_STEP_SUMMARY }
            '```' >> $env:GITHUB_STEP_SUMMARY
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-msvc-probe
          path: |
            build/build.log
            build/pe_probe.txt
            build/dumpbin.txt
          if-no-files-found: warn
